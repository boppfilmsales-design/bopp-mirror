name: Sync Overrides to seed_data.js

on:
  workflow_dispatch:
    inputs:
      overrides:
        description: 'Overrides JSON data'
        required: true
      commit_message:
        description: 'Commit message'
        required: false
        default: 'Auto sync overrides from admin'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Validate overrides JSON
        run: |
          echo "${{ github.event.inputs.overrides }}" | jq . > /tmp/overrides.json
          echo "Overrides validated successfully"

      - name: Update seed_data.js
        run: |
          # Read the current seed_data.js
          SEED_FILE="admin/js/seed_data.js"

          # Read overrides
          OVERIDES=$(cat /tmp/overrides.json)

          # Create a Python script to merge overrides
          python3 << PYTHON_SCRIPT
          import json
          import re
          import sys

          # Read seed_data.js
          with open('$SEED_FILE', 'r', encoding='utf-8') as f:
              content = f.read()

          # Parse the existing seed data using brace counting (not regex)
          seed_start = content.find('var XGXCMS_SEED')
          if seed_start == -1:
              print("ERROR: Could not find XGXCMS_SEED in seed_data.js")
              sys.exit(1)

          json_start = content.find('{', seed_start)
          if json_start == -1:
              print("ERROR: Could not find JSON object start")
              sys.exit(1)

          # Brace counting to find the actual end of JSON
          brace_depth = 0
          in_string = False
          escape_next = False
          json_end = json_start

          for i in range(json_start, len(content)):
              ch = content[i]
              if escape_next:
                  escape_next = False
                  continue
              if ch == '\\' and in_string:
                  escape_next = True
                  continue
              if ch == '"':
                  in_string = not in_string
              elif not in_string:
                  if ch == '{':
                      brace_depth += 1
                  elif ch == '}':
                      brace_depth -= 1
                      if brace_depth == 0:
                          json_end = i + 1
                          break

          seed_json_str = content[json_start:json_end]
          if brace_depth != 0:
              print("ERROR: Unbalanced braces in JSON")
              sys.exit(1)

          # Parse JSON
          seed_json = json.loads(seed_json_str)

          # Load overrides
          overrides = json.loads('''$OVERIDES''')

          # Merge overrides into seed
          for cid, items in overrides.items():
              if cid not in seed_json:
                  seed_json[cid] = []
              for iid, item in items.items():
                  if item is None:
                      # Remove item
                      seed_json[cid] = [x for x in seed_json[cid] if str(x.get('i_id')) != iid]
                  else:
                      # Add or update item
                      found = False
                      for i, existing in enumerate(seed_json[cid]):
                          if str(existing.get('i_id')) == iid:
                              seed_json[cid][i] = item
                              found = True
                              break
                      if not found:
                          seed_json[cid].append(item)

          # Serialize back to JS
          new_seed = json.dumps(seed_json, ensure_ascii=False, indent=2)

          # Replace in content
          new_content = content[:json_start] + 'var XGXCMS_SEED = ' + new_seed + ';' + content[json_end:]

          # Write back
          with open('$SEED_FILE', 'w', encoding='utf-8') as f:
              f.write(new_content)

          print("seed_data.js updated successfully")
          PYTHON_SCRIPT

      - name: Remove overrides from seed_data.js (keep in localStorage only)
        run: |
          # Remove any XGXCMS_OVERRIDES lines to avoid duplication
          sed -i '/var XGXCMS_OVERRIDES/d' admin/js/seed_data.js
          sed -i '/^});/d' admin/js/seed_data.js

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add admin/js/seed_data.js
          git commit -m "${{ github.event.inputs.commit_message || 'Auto sync overrides to seed_data.js' }}" || echo "No changes to commit"
          git push
