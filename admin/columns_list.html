<!DOCTYPE html>
<html>
<head>
<title>栏目管理</title>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<link href="css/admin.css" rel="stylesheet" type="text/css" />
<link href="js/layui/css/layui.css" rel="stylesheet" type="text/css" />
<script src="js/jquery.min.js" type="text/javascript"></script>
<script src="js/layui/layui.js" type="text/javascript"></script>
<script src="js/admin.js" type="text/javascript"></script>
<script src="js/cms.js" type="text/javascript"></script>
</head>
<body>
<script>cms_guard();</script>
<div class="nowplace"><span class="nownavi">当前位置：<cite>栏目管理</cite>&gt;<cite id="grpName">栏目组</cite></span></div>
<div style="padding:15px;">
<table class="layui-table">
  <thead><tr><th>c_id</th><th>栏目名称</th><th>信息数</th><th>操作</th></tr></thead>
  <tbody id="tbody"></tbody>
</table>
</div>
<script type="text/javascript">
var pid=parseInt((location.search.match(/pid=(\d+)/)||[])[1]||'0');
var g=CMS.groupByPid(pid);
$('#grpName').text(g?g.title:'栏目组');
function render(){
	if(!g) return;
	var h='';
	for(var i=0;i<g.subs.length;i++){
		var s=g.subs[i];
		var cnt=CMS.getInfos(s.c_id).length;
		h+='<tr><td>'+s.c_id+'</td><td>'+CMS.esc(s.name)+'</td><td>'+cnt+'</td>'+
		   '<td><a class="layui-btn layui-btn-xs" href="info_list.html?c_id='+s.c_id+'">管理信息</a></td></tr>';
	}
	$('#tbody').html(h);
}
render();
</script>
</body>
</html>
