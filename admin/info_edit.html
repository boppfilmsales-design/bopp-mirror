<!DOCTYPE html>
<html>
<head>
<title>编辑信息</title>
<meta http-equiv="Content-Type" content="text/html" charset="utf-8" />
<link href="css/admin.css" rel="stylesheet" type="text/css" />
<link href="js/layui/css/layui.css" rel="stylesheet" type="text/css" />
<script src="js/jquery.min.js" type="text/javascript"></script>
<script src="js/layui/layui.js" type="text/javascript"></script>
<script src="js/admin.js" type="text/javascript"></script>
<script src="js/seed_data.js" type="text/javascript"></script>
<script src="js/cms.js" type="text/javascript"></script>
<style>
.field-group{margin-bottom:20px;padding:15px;background:#f8f8f8;border-radius:4px;}
.field-group h4{margin:0 0 15px 0;color:#333;border-bottom:1px solid #ddd;padding-bottom:8px;}
.field-row{margin-bottom:12px;}
.field-row label{display:block;margin-bottom:5px;font-weight:bold;color:#555;}
.field-row input[type="text"],.field-row textarea{width:100%;padding:8px;border:1px solid #ddd;border-radius:4px;box-sizing:border-box;}
.field-row textarea{height:150px;font-family:monospace;font-size:12px;}
.field-row .hint{font-size:12px;color:#999;margin-top:4px;}
</style>
</head>
<body>
<script>cms_guard();</script>
<div class="nowplace"><span class="nownavi">当前位置：<cite>内容管理</cite>&gt;<cite id="colName"></cite>&gt;<cite>编辑</cite></span></div>
<form class="layui-form" style="padding:20px;" onsubmit="return false;">
  <input type="hidden" id="c_id"><input type="hidden" id="i_id">

  <div class="field-group">
    <h4>基本信息</h4>
    <div class="field-row">
      <label>标题</label>
      <input type="text" id="title" class="layui-input">
    </div>
    <div class="field-row">
      <label>副标题</label>
      <input type="text" id="sub_title" class="layui-input" placeholder="产品副标题或英文名称">
    </div>
    <div class="field-row">
      <label>封面图片 URL</label>
      <input type="text" id="pic" class="layui-input" placeholder="相对路径，如 ../upload/image/xxx.jpg">
      <div class="hint">支持相对路径或完整URL</div>
    </div>
    <div class="field-row">
      <label>产品编号</label>
      <input type="text" id="code" class="layui-input" placeholder="如: BOPP-CP-2024">
    </div>
    <div class="field-row">
      <label>商品原价</label>
      <input type="text" id="price" class="layui-input" placeholder="如: $1500/ton 或 面议">
    </div>
  </div>

  <div class="field-group">
    <h4>详细内容</h4>
    <div class="field-row">
      <label>详细内容 (HTML)</label>
      <div style="margin-bottom:6px;">
        <input type="file" id="imgFile" accept="image/*" style="display:none;">
        <button type="button" class="layui-btn layui-btn-sm" onclick="$('#imgFile').trigger('click')">插入图片(本地上传)</button>
        <span style="color:#999;font-size:12px;">  也可直接粘贴/输入 HTML，图片支持 &lt;img src="相对路径"&gt;</span>
      </div>
      <textarea id="content" style="width:100%;height:360px;font-family:monospace;font-size:13px;"></textarea>
    </div>
  </div>

  <div class="field-group">
    <h4>技术参数</h4>
    <div class="field-row">
      <label>TECHNICAL PARAMETERS (HTML)</label>
      <textarea id="tech_params" style="height:200px;" placeholder="<table>...技术参数表格...</table>"></textarea>
      <div class="hint">技术参数部分，可包含表格、列表等HTML内容</div>
    </div>
  </div>

  <div class="field-group">
    <h4>帮助链接</h4>
    <div class="field-row">
      <label>Helpful Links (HTML)</label>
      <textarea id="helpful_links" style="height:120px;" placeholder="<a href='...'>链接文字</a>"></textarea>
      <div class="hint">相关产品链接、规格下载等</div>
    </div>
  </div>

  <div class="field-group">
    <h4>相册</h4>
    <div class="field-row">
      <label>相册图片 (JSON 数组)</label>
      <textarea id="album" style="height:100px;font-family:monospace;" placeholder='["../upload/image/1.jpg","../upload/image/2.jpg"]'></textarea>
      <div class="hint">多个图片路径，JSON 数组格式</div>
    </div>
  </div>

  <div class="field-group">
    <h4>SEO 优化</h4>
    <div class="field-row">
      <label>SEO Title</label>
      <input type="text" id="seo_title" class="layui-input" placeholder="搜索引擎标题，建议不超过60字符">
    </div>
    <div class="field-row">
      <label>SEO Keywords</label>
      <input type="text" id="seo_keywords" class="layui-input" placeholder="关键词，逗号分隔">
    </div>
    <div class="field-row">
      <label>SEO Description</label>
      <textarea id="seo_description" style="height:80px;" placeholder="页面描述，建议不超过160字符"></textarea>
    </div>
  </div>

  <div class="field-row">
    <div class="layui-input-block">
      <button class="layui-btn" onclick="doSave()">保存</button>
      <button class="layui-btn layui-btn-primary" onclick="history.back()">返回</button>
      <span id="saveMsg" style="color:#666;margin-left:10px;"></span>
    </div>
  </div>
</form>

<script type="text/javascript">
var cid=parseInt((location.search.match(/c_id=(\d+)/)||[])[1]||'0');
var iid=parseInt((location.search.match(/i_id=(\d+)/)||[])[1]||'0');
$('#colName').text(CMS.colName(cid));
$('#c_id').val(cid); $('#i_id').val(iid);
// 载入数据（基础+覆盖）
(function(){
	var it = iid ? CMS.getInfo(cid,iid) : null;
	$('#saveMsg').text('已载入'+(it?'：'+CMS.esc(it.title):'（新增）'));
	if(it){
		if(it.title) $('#title').val(it.title);
		if(it.sub_title) $('#sub_title').val(it.sub_title);
		if(it.pic) $('#pic').val(it.pic);
		if(it.code) $('#code').val(it.code);
		if(it.price) $('#price').val(it.price);
		if(it.content) $('#content').val(it.content);
		if(it.tech_params) $('#tech_params').val(it.tech_params);
		if(it.helpful_links) $('#helpful_links').val(it.helpful_links);
		if(it.album) $('#album').val(JSON.stringify(it.album));
		if(it.seo_title) $('#seo_title').val(it.seo_title);
		if(it.seo_keywords) $('#seo_keywords').val(it.seo_keywords);
		if(it.seo_description) $('#seo_description').val(it.seo_description);
	}
})();
// 本地上传图片 → base64 → 插入 textarea
document.getElementById('imgFile').addEventListener('change', function(){
	var f=this.files && this.files[0]; if(!f) return;
	if(f.size>2*1024*1024){ alert('图片过大，请压缩到2MB内'); this.value=''; return; }
	var rd=new FileReader();
	var self=this;
	rd.onload=function(){
		var ta=document.getElementById('content');
		ta.value += (ta.value?'\n':'')+'<img src="'+rd.result+'" alt="" />';
		self.value='';
	};
	rd.readAsDataURL(f);
});
function doSave(){
	var title=$.trim($('#title').val());
	if(!title){layui.use('layer',function(){layui.layer.msg('请填写标题');});return;}
	var item={
		title:title,
		sub_title:$.trim($('#sub_title').val()),
		pic:$.trim($('#pic').val()),
		code:$.trim($('#code').val()),
		price:$.trim($('#price').val()),
		content:$('#content').val(),
		tech_params:$('#tech_params').val(),
		helpful_links:$('#helpful_links').val(),
		seo_title:$.trim($('#seo_title').val()),
		seo_keywords:$.trim($('#seo_keywords').val()),
		seo_description:$.trim($('#seo_description').val()),
		addtime:CMS.now()
	};
	// 解析相册
	var albumVal=$.trim($('#album').val());
	if(albumVal){
		try{ item.album=JSON.parse(albumVal); }catch(e){ item.album=[]; }
	}
	var isNew = !iid;
	if(isNew){ CMS.addInfo(cid,item); }
	else{ item.i_id=iid; CMS.updInfo(cid,iid,item); }
	// 校验写入成功
	var checkId = isNew ? item.i_id : iid;
	var chk=CMS.getInfo(cid, checkId);
	layui.use('layer',function(){ var layer=layui.layer;
		if(chk && chk.title===title){
			$('#saveMsg').text('保存成功（已写入本地存储）');
			layer.msg('保存成功',{time:1200},function(){ location.href='info_list.html?c_id='+cid; });
		}else{
			layer.msg('保存失败：浏览器存储不可用');
		}
	});
}
</script>
</body>
</html>
