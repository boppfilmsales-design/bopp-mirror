<!DOCTYPE html>
<html>
<head>
<title>编辑信息</title>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<link href="css/admin.css" rel="stylesheet" type="text/css" />
<link href="js/layui/css/layui.css" rel="stylesheet" type="text/css" />
<script src="js/jquery.min.js" type="text/javascript"></script>
<script src="js/layui/layui.js" type="text/javascript"></script>
<script src="js/admin.js" type="text/javascript"></script>
<script src="js/seed_data.js" type="text/javascript"></script>
<script src="js/cms.js" type="text/javascript"></script>
<link rel="stylesheet" href="kindeditor/themes/default/default.css" />
<script charset="utf-8" src="kindeditor/kindeditor.js"></script>
<script charset="utf-8" src="kindeditor/lang/zh_CN.js"></script>
<script charset="utf-8" src="kindeditor/plugins/b64upload.js"></script>
</head>
<body>
<script>cms_guard();</script>
<div class="nowplace"><span class="nownavi">当前位置：<cite>内容管理</cite>&gt;<cite id="colName"></cite>&gt;<cite>编辑</cite></span></div>
<form class="layui-form" style="padding:20px;" onsubmit="return false;">
  <input type="hidden" id="c_id"><input type="hidden" id="i_id">
  <div class="layui-form-item">
    <label class="layui-form-label">标题</label>
    <div class="layui-input-block"><input class="layui-input" id="title"></div>
  </div>
  <div class="layui-form-item">
    <label class="layui-form-label">封面图片URL</label>
    <div class="layui-input-block"><input class="layui-input" id="pic" placeholder="相对路径，如 ../upload/image/xxx.jpg"></div>
  </div>
  <div class="layui-form-item">
    <label class="layui-form-label">内容</label>
    <div class="layui-input-block"><textarea id="content" name="content" style="width:100%;height:320px;visibility:hidden;"></textarea></div>
  </div>
  <div class="layui-form-item">
    <div class="layui-input-block">
      <button class="layui-btn" onclick="doSave()">保存</button>
      <button class="layui-btn layui-btn-primary" onclick="history.back()">返回</button>
    </div>
  </div>
</form>
<script type="text/javascript">
var cid=parseInt((location.search.match(/c_id=(\d+)/)||[])[1]||'0');
var iid=parseInt((location.search.match(/i_id=(\d+)/)||[])[1]||'0');
$('#colName').text(CMS.colName(cid));
$('#c_id').val(cid); $('#i_id').val(iid);
var editor;
function initEditor(){
	var it = iid ? CMS.getInfo(cid,iid) : null;
	KindEditor.ready(function(K){
		editor = K.create('#content', {
			width:'100%', height:320,
			allowFileManager: false,
			uploadJson: 'kindeditor/php/upload_json.php',
			filterMode: false,
			items:['source','|','undo','redo','|','bold','italic','underline','forecolor','|','justifyleft','justifycenter','justifyright','|','insertorderedlist','insertunorderedlist','|','image','multiimage','link','unlink','|','removeformat','fullscreen']
		});
		patchKindEditorUpload(editor);
		editor.ready(function(){
			if(it && it.content) editor.html(it.content);
		});
	});
}
function doSave(){
	var title=$.trim($('#title').val());
	if(!title){layui.use('layer',function(){layui.layer.msg('请填写标题');});return;}
	var html = editor ? editor.html() : $('#content').val();
	var item={title:title, pic:$.trim($('#pic').val()), content:html, addtime:CMS.now()};
	if(iid){ item.i_id=iid; CMS.updInfo(cid,iid,item); }
	else{ CMS.addInfo(cid,item); }
	layui.use('layer',function(){ var layer=layui.layer; layer.msg('保存成功',{time:800},function(){ location.href='info_list.html?c_id='+cid; }); });
}
initEditor();
</script>
</body>
</html>
