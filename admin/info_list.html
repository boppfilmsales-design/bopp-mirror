<!DOCTYPE html>
<html>
<head>
<title>内容管理</title>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<link href="css/admin.css" rel="stylesheet" type="text/css" />
<link href="js/layui/css/layui.css" rel="stylesheet" type="text/css" />
<script src="js/jquery.min.js" type="text/javascript"></script>
<script src="js/layui/layui.js" type="text/javascript"></script>
<script src="js/admin.js" type="text/javascript"></script>
<script src="js/seed_data.js" type="text/javascript"></script>
<script src="js/cms.js" type="text/javascript"></script>
</head>
<body>
<script>cms_guard();</script>
<div class="nowplace">
	<span class="nownavi">
		当前位置：
		<cite>内容管理</cite>
&gt;<cite id="grpName">栏目</cite>&gt;<cite id="colName"></cite>	</span>
</div>
<div class="layui-tab layui-tab-brief nav3">
  <ul class="layui-tab-title" id="subTabs">
    <!-- 子分类 tab 由 JS 填充 -->
  </ul>
</div>
<div class="layui-btn-group" style="padding:10px 15px;">
	<button class="layui-btn" onclick="location.href='info_edit.html?c_id='+cid+'&i_id=0'"><i class="layui-icon">&#xe654;</i> 新增信息</button>
	<button class="layui-btn layui-btn-danger" onclick="delmsg()"><i class="layui-icon">&#xe640;</i> 批量删除</button>
</div>
<div style="padding:0 15px 20px;">
<table class="layui-table" lay-even>
  <thead>
    <tr>
      <th style="width:40px;"><input type="checkbox" id="selall" onclick="selall(this)"></th>
      <th>ID</th><th>标题</th><th>时间</th><th style="width:160px;">操作</th>
    </tr>
  </thead>
  <tbody id="tbody"></tbody>
</table>
<div id="pages" style="text-align:right; padding:10px 0;"></div>
</div>
<form id="forminfo" style="display:none;"><input type="hidden" id="action"><input type="hidden" name="c_id" value=""></form>
<script type="text/javascript">
var cid = parseInt((location.search.match(/c_id=(\d+)/)||[])[1]||'0');
var group = CMS.groupByPid ? null : null;
// 找所属组（按 subs 匹配）
(function(){ for(var i=0;i<CMS.GROUPS.length;i++){ for(var j=0;j<CMS.GROUPS[i].subs.length;j++){ if(CMS.GROUPS[i].subs[j].c_id==cid){ $('#grpName').text(CMS.GROUPS[i].title); } } } })();
$('#colName').text(CMS.colName(cid));
// 子分类 tab：同组子栏目 + SUBS 子分类
var curGroup=null;
for(var i=0;i<CMS.GROUPS.length;i++){ for(var j=0;j<CMS.GROUPS[i].subs.length;j++){ if(CMS.GROUPS[i].subs[j].c_id==cid){ curGroup=CMS.GROUPS[i]; } } }
var tabHtml='';
if(curGroup){
	for(var j=0;j<curGroup.subs.length;j++){
		var s=curGroup.subs[j];
		tabHtml+='<li'+(s.c_id==cid?' class="layui-this"':'')+'><a href="info_list.html?c_id='+s.c_id+'">'+CMS.esc(s.name)+'</a></li>';
	}
	$('#subTabs').html(tabHtml);
}
// 若是子分类(不在 GROUPS.subs 但属于某大类SUBS), 也显示同组tab
var parentCid=null;
for(var pc in CMS.SUBS){ if(CMS.SUBS[pc].indexOf(cid)!=-1){ parentCid=parseInt(pc); } }
if(parentCid){
	// 找到父大类所在的组
	var pg=null;
	for(var i=0;i<CMS.GROUPS.length;i++){ for(var j=0;j<CMS.GROUPS[i].subs.length;j++){ if(CMS.GROUPS[i].subs[j].c_id==parentCid){ pg=CMS.GROUPS[i]; } } }
	var ph='';
	if(pg){ for(var j=0;j<pg.subs.length;j++){ var s2=pg.subs[j]; ph+='<li'+(s2.c_id==parentCid?' class="layui-this"':'')+'><a href="info_list.html?c_id='+s2.c_id+'">'+CMS.esc(s2.name)+'</a></li>'; } }
	// 追加该大类的子分类tab
	var subs=CMS.SUBS[parentCid]||[];
	for(var j=0;j<subs.length;j++){ var c2=subs[j]; ph+='<li'+(c2==cid?' class="layui-this"':'')+'><a href="info_list.html?c_id='+c2+'">'+CMS.esc(CMS.subName(c2))+'</a></li>'; }
	$('#subTabs').html(ph);
}
// 数据加载
function render(){
	var list=CMS.getInfos(cid);
	var h='';
	for(var i=0;i<list.length;i++){
		var it=list[i];
		h+='<tr><td><input type="checkbox" name="i_id[]" value="'+it.i_id+'"></td>'+
		   '<td>'+it.i_id+'</td><td>'+CMS.esc(it.title)+'</td><td>'+CMS.esc(it.addtime||'')+'</td>'+
		   '<td><a class="layui-btn layui-btn-xs" href="info_edit.html?c_id='+cid+'&i_id='+it.i_id+'">编辑</a> '+
		   '<a class="layui-btn layui-btn-danger layui-btn-xs" href="javascript:;" onclick="mdel('+it.i_id+',\''+CMS.esc(it.title).replace(/'/g,'')+'\')">删除</a></td></tr>';
	}
	$('#tbody').html(h||'<tr><td colspan="5" style="text-align:center;color:#999;">暂无数据</td></tr>');
	layui.use(['laypage'], function(){
		var laypage=layui.laypage;
		laypage.render({ elem:'pages', count:list.length, limit:20, curr:1, jump:function(obj,first){ } });
	});
}
render();
function selall(e){ var c=e.checked; $("input[name='i_id[]']:checkbox").each(function(){ $(this).prop('checked',c); }); }
function mdel(id,name){
	layui.use('layer',function(){ var layer=layui.layer;
		layer.confirm('确认要删除信息【'+name+'】吗？',{icon:3,title:'删除信息'},function(){
			CMS.delInfo(cid,id); layer.msg('已删除'); render();
		});
	});
}
function delmsg(){
	if(!$("input[name='i_id[]']:checked").length){layui.use('layer',function(){layui.layer.msg('请选择要删除的信息');});return false;}
	layui.use('layer',function(){ var layer=layui.layer;
		layer.confirm('确认要删除指定的信息吗？',{icon:3,title:'删除信息'},function(){
			$("input[name='i_id[]']:checked").each(function(){ CMS.delInfo(cid,parseInt(this.value)); });
			layer.msg('已删除'); render();
		});
	});
}
</script>
</body>
</html>
