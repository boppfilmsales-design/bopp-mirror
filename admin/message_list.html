<!DOCTYPE html>
<html>
<head>
<title>留言板管理</title>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<link href="css/admin.css" rel="stylesheet" type="text/css" />
<link href="js/layui/css/layui.css" rel="stylesheet" type="text/css" />
<script src="js/jquery.min.js" type="text/javascript"></script>
<script src="js/layui/layui.js" type="text/javascript"></script>
<script src="js/admin.js" type="text/javascript"></script>
<script src="js/seed_data.js" type="text/javascript"></script>
<script src="js/cms.js" type="text/javascript"></script>
</head>
<body>
<script>cms_guard();</script>
<div class="nowplace"><span class="nownavi">当前位置：<cite>高级管理</cite>&gt;<cite>留言板</cite></span></div>
<div class="layui-btn-group" style="padding:10px 15px;">
	<button class="layui-btn layui-btn-danger" onclick="delmsg()"><i class="layui-icon">&#xe640;</i> 批量删除</button>
</div>
<div style="padding:0 15px 20px;">
<table class="layui-table" lay-even>
  <thead>
    <tr><th style="width:40px;"><input type="checkbox" id="selall" onclick="selall(this)"></th><th>ID</th><th>姓名/公司</th><th>邮箱</th><th>电话</th><th>内容</th><th>时间</th><th style="width:120px;">操作</th></tr>
  </thead>
  <tbody id="tbody"></tbody>
</table>
</div>
<script type="text/javascript">
function render(){
	var list=CMS.getMsgs();
	var h='';
	for(var i=0;i<list.length;i++){
		var m=list[i];
		h+='<tr><td><input type="checkbox" name="m_id[]" value="'+m.m_id+'"></td>'+
		   '<td>'+m.m_id+'</td><td>'+CMS.esc(m.name)+'</td><td>'+CMS.esc(m.email)+'</td><td>'+CMS.esc(m.phone)+'</td>'+
		   '<td>'+CMS.esc(String(m.content||'').slice(0,50))+'</td><td>'+CMS.esc(m.addtime||'')+'</td>'+
		   '<td><a class="layui-btn layui-btn-xs" href="javascript:;" onclick="medit('+m.m_id+')">查看</a> '+
		   '<a class="layui-btn layui-btn-danger layui-btn-xs" href="javascript:;" onclick="mdel('+m.m_id+')">删除</a></td></tr>';
	}
	$('#tbody').html(h||'<tr><td colspan="8" style="text-align:center;color:#999;">暂无留言</td></tr>');
}
function selall(e){ var c=e.checked; $("input[name='m_id[]']:checkbox").each(function(){ $(this).prop('checked',c); }); }
function medit(id){
	var m=CMS.getMsg(id); if(!m) return;
	layui.use('layer',function(){ var layer=layui.layer;
		layer.open({type:1,title:'查看留言',area:['460px','420px'],content:
			'<div style="padding:20px;line-height:2;">'+
			'<b>姓名/公司：</b>'+CMS.esc(m.name)+'<br>'+
			'<b>邮箱：</b>'+CMS.esc(m.email)+'<br>'+
			'<b>电话：</b>'+CMS.esc(m.phone)+'<br>'+
			'<b>时间：</b>'+CMS.esc(m.addtime)+'<br>'+
			'<b>内容：</b><p style="margin-top:8px;">'+CMS.esc(m.content)+'</p></div>'});
	});
}
function mdel(id){
	layui.use('layer',function(){ var layer=layui.layer;
		layer.confirm('确认要删除留言吗？',{icon:3,title:'删除留言'},function(){ CMS.delMsg(id); layer.msg('已删除'); render(); });
	});
}
function delmsg(){
	if(!$("input[name='m_id[]']:checked").length){layui.use('layer',function(){layui.layer.msg('请选择要删除的留言');});return false;}
	layui.use('layer',function(){ var layer=layui.layer;
		layer.confirm('确认要删除指定的留言吗？',{icon:3,title:'删除留言'},function(){
			$("input[name='m_id[]']:checked").each(function(){ CMS.delMsg(parseInt(this.value)); });
			layer.msg('已删除'); render();
		});
	});
}
render();
</script>
</body>
</html>
