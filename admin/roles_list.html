<!DOCTYPE html>
<html>
<head>
<title>角色管理</title>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<link href="css/admin.css" rel="stylesheet" type="text/css" />
<link href="js/layui/css/layui.css" rel="stylesheet" type="text/css" />
<script src="js/jquery.min.js" type="text/javascript"></script>
<script src="js/layui/layui.js" type="text/javascript"></script>
<script src="js/admin.js" type="text/javascript"></script>
<script src="js/cms.js" type="text/javascript"></script>
</head>
<body>
<script>cms_guard();</script>
<div class="nowplace"><span class="nownavi">当前位置：<cite>权限管理</cite>&gt;<cite>角色管理</cite></span></div>
<div style="padding:15px;">
<table class="layui-table">
  <thead><tr><th>ID</th><th>角色名称</th></tr></thead>
  <tbody id="tbody"></tbody>
</table>
</div>
<script type="text/javascript">
function render(){
	var list=CMS.getRoles();
	var h='';
	for(var i=0;i<list.length;i++){ h+='<tr><td>'+list[i].id+'</td><td>'+CMS.esc(list[i].name)+'</td></tr>'; }
	$('#tbody').html(h);
}
render();
</script>
</body>
</html>
