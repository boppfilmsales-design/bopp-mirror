<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>数据导出工具</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 800px; margin: 0 auto; }
        .step { background: #f5f5f5; padding: 15px; margin: 10px 0; border-left: 4px solid #009688; }
        button { background: #009688; color: white; border: none; padding: 10px 20px; margin: 5px; cursor: pointer; border-radius: 4px; }
        button:hover { background: #00796b; }
        textarea { width: 100%; height: 200px; font-family: monospace; font-size: 12px; margin: 10px 0; }
        .output { background: #e8f5e9; padding: 15px; margin: 10px 0; white-space: pre-wrap; word-break: break-all; max-height: 400px; overflow-y: auto; }
    </style>
</head>
<body>
    <h1>📤 数据导出工具</h1>
    <p>将后台编辑的数据导出到 seed_data.js，以便推送到线上</p>

    <div class="step">
        <h3>步骤 1: 导出 localStorage 数据</h3>
        <button onclick="exportData()">导出数据</button>
        <div id="exportOutput" class="output" style="display:none;"></div>
    </div>

    <div class="step">
        <h3>步骤 2: 合并到 seed_data.js</h3>
        <p>将导出的数据合并到 <code>admin/js/seed_data.js</code></p>
        <textarea id="mergeInstruction" readonly>
// 在 seed_data.js 中，找到：
var XGXCMS_SEED = { ... };

// 替换为（保留原有数据，添加 overrides）：
var XGXCMS_SEED = { ... }; // 原有数据保持不变
var XGXCMS_OVERRIDES = { ... }; // 粘贴导出的数据
</textarea>
    </div>

    <div class="step">
        <h3>步骤 3: 提交推送</h3>
        <button onclick="copyInstructions()">复制操作说明</button>
        <button onclick="window.location.href='http://localhost:8888/admin/info_list.html?c_id=33'">返回后台</button>
    </div>

    <script>
        function exportData() {
            var overrides = {};
            try {
                overrides = JSON.parse(localStorage.getItem('_xgxcms_overrides_') || '{}');
            } catch(e) {}

            if (!Object.keys(overrides).length) {
                alert('⚠️ 当前浏览器没有保存任何数据！\n\n请先在后台编辑并保存内容。');
                return;
            }

            var output = 'var XGXCMS_OVERRIDES = ' + JSON.stringify(overrides, null, 2) + ';';
            var outputDiv = document.getElementById('exportOutput');
            outputDiv.textContent = output;
            outputDiv.style.display = 'block';

            // 自动复制到剪贴板
            var ta = document.createElement('textarea');
            ta.value = output;
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            document.body.removeChild(ta);

            alert('✅ 数据已导出并复制到剪贴板！\n\n下一步：\n1. 打开 admin/js/seed_data.js\n2. 在文件末尾添加：' + output.substring(0, 50) + '...\n3. git commit && git push');
        }

        function copyInstructions() {
            var text = '数据同步步骤：\n\n1. 在浏览器控制台运行：localStorage.getItem("_xgxcms_overrides_")\n2. 将结果复制到 seed_data.js 末尾\n3. 添加代码：var XGXCMS_OVERRIDES = {结果};\n4. git add -A && git commit -m "sync overrides"\n5. git -c http.proxy=http://127.0.0.1:7897 push origin main';
            navigator.clipboard.writeText(text).then(function() {
                alert('✅ 操作说明已复制到剪贴板！');
            });
        }

        // 页面加载时检查是否有数据
        window.onload = function() {
            var overrides = {};
            try {
                overrides = JSON.parse(localStorage.getItem('_xgxcms_overrides_') || '{}');
            } catch(e) {}

            if (Object.keys(overrides).length) {
                var summary = [];
                for (var cid in overrides) {
                    for (var iid in overrides[cid]) {
                        if (overrides[cid][iid]) {
                            summary.push('c_id=' + cid + ', i_id=' + iid + ', title=' + overrides[cid][iid].title);
                        }
                    }
                }
                document.getElementById('exportOutput').textContent = '📊 发现 ' + summary.length + ' 条待同步数据：\n' + summary.join('\n');
                document.getElementById('exportOutput').style.display = 'block';
            }
        };
    </script>
</body>
</html>
