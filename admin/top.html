<!DOCTYPE html>
<html>
<head>
<title>top</title>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<link href="css/admin.css" rel="stylesheet" type="text/css" />
<link href="js/layui/css/layui.css" rel="stylesheet" type="text/css" />
<script src="js/jquery.min.js" type="text/javascript"></script>
<script src="js/layui/layui.js" type="text/javascript"></script>
<script src="js/admin.js" type="text/javascript"></script>
<script type="text/javascript">
layui.use(['element','layer'], function(){
	var element = layui.element
	,layer = layui.layer;
});
function nav(t){
	$('.layui-nav li').removeClass('layui-this');
	$('.layui-nav li:nth-child('+t+')').addClass('layui-this');
	$('#leftFrame',parent.document.body).attr('src','menu_'+t+'.html')
}
function quit(){
	try{
		top.rightFrame.layer.confirm('确认要退出吗?', {icon: 3, title:'退出'}, function(index){
			try{localStorage.removeItem('xgxcms_admin');}catch(e){}
			top.location.href = 'login.html';
		});
	}catch(e){top.location.href = 'login.html';}
}
</script>
</head>

<body class="layui-layout-admin top">
<div class="layui-header">
	<div class="logo">XgxCms<span>2018</span></div>
	<ul class="layui-nav topnav">
		<li class="layui-nav-item layui-this"><a href="javascript:;" onClick="nav(1);">内容管理</a></li>
				<li class="layui-nav-item"><a href="javascript:;" onClick="nav(2);">高级管理</a></li>
			</ul>
	<ul class="layui-nav adminnav">
		<li class="layui-nav-item">
			<a href="../index.html" target="_blank"><i class="layui-icon">&#xe68e;</i> 网站首页</a>
		</li>
		<li class="layui-nav-item">
			<a href="javascript:;" onClick="$('#rightFrame',parent.document.body).attr('src','config_me.html');"><i class="layui-icon">&#xe612;</i> 超级管理员</a>
		</li>
		<li class="layui-nav-item"><a href="javascript:;" onClick="quit();">退出</a></li>
	</ul>
</div>
</body>
</html>
